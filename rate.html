<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客評價與訂單查詢 - 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="star" class="w-6 h-6 fill-indigo-600"></i>
            </div>
            <h1 class="text-xl font-black text-slate-900">顧客訂單查詢與評價</h1>
            <p class="text-xs text-slate-400">請輸入您的「訂單編號」(例如 OD-001) 來查看訂單並留下寶貴評價</p>
        </div>

        <!-- 查詢表單 -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">訂單編號</label>
                <div class="flex gap-2">
                    <input type="text" id="searchOrderId" placeholder="例如: OD-001" class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase">
                    <button onclick="searchOrder()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">查詢</button>
                </div>
            </div>
        </div>

        <!-- 查詢結果與評價區塊 (預設隱藏) -->
        <div id="resultContainer" class="hidden space-y-4 pt-4 border-t border-slate-100">
            <div class="bg-slate-50 p-4 rounded-2xl space-y-2 border border-slate-100">
                <div class="flex justify-between text-xs text-slate-500">
                    <span>買家: <strong id="resCustomer" class="text-slate-800"></strong></span>
                    <span id="resStatus" class="font-bold"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span id="resProduct" class="font-bold text-slate-900 text-base"></span>
                    <span id="resPrice" class="text-indigo-600 font-bold"></span>
                </div>
            </div>

            <!-- 評價表單 -->
            <div id="ratingSection" class="space-y-3">
                <label class="block text-xs font-semibold text-slate-600">給予商店評分</label>
                <div class="flex justify-center gap-2 py-2" id="starSelector">
                    <button type="button" onclick="setRating(1)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(2)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(3)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(4)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(5)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                </div>
                <button onclick="submitRating()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-sm font-bold shadow-sm transition">送出評價</button>
            </div>

            <div id="ratedNotice" class="hidden text-center py-3 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-xl">
                感謝您的評價！這筆訂單已經完成評分。
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjpZ8i-lsWHjrn9wHAOqTFlxKKUWkdZyQ",
            authDomain: "project-1584313366507677848.firebaseapp.com",
            projectId: "project-1584313366507677848",
            storageBucket: "project-1584313366507677848.firebasestorage.app",
            messagingSenderId: "486873849194",
            appId: "1:486873849194:web:3eb6181053f070bda05913",
            measurementId: "G-NYQQKNLE50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSelectedDocId = null;
        let selectedRating = 5;

        window.searchOrder = async function() {
            const queryId = document.getElementById('searchOrderId').value.trim().toUpperCase();
            if (!queryId) {
                alert('請輸入訂單編號！');
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                let found = null;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.id && data.id.toUpperCase() === queryId) {
                        found = { docId: docSnap.id, ...data };
                    }
                });

                if (!found) {
                    alert('找不到此訂單編號，請確認後再試一次！');
                    document.getElementById('resultContainer').classList.add('hidden');
                    return;
                }

                currentSelectedDocId = found.docId;
                document.getElementById('resCustomer').innerText = found.customer;
                document.getElementById('resProduct').innerText = found.product;
                document.getElementById('resPrice').innerText = `NT$${Number(found.price).toLocaleString()}`;
                document.getElementById('resStatus').innerText = found.status;

                const ratingSec = document.getElementById('ratingSection');
                const ratedNotice = document.getElementById('ratedNotice');

                if (found.rating && found.rating > 0) {
                    ratingSec.classList.add('hidden');
                    ratedNotice.classList.remove('hidden');
                } else {
                    ratingSec.classList.remove('hidden');
                    ratedNotice.classList.add('hidden');
                    setRating(5); // 預設5星
                }

                document.getElementById('resultContainer').classList.remove('hidden');
            } catch (e) {
                alert('查詢發生錯誤：' + e.message);
            }
        };

        window.setRating = function(stars) {
            selectedRating = stars;
            const buttons = document.querySelectorAll('#starSelector button');
            buttons.forEach((btn, index) => {
                if (index < stars) {
                    btn.className = 'text-2xl text-amber-400 transition';
                } else {
                    btn.className = 'text-2xl text-slate-300 hover:text-amber-400 transition';
                }
            });
        };

        window.submitRating = async function() {
            if (!currentSelectedDocId) return;
            try {
                const orderRef = doc(db, "orders", currentSelectedDocId);
                await updateDoc(orderRef, { rating: selectedRating });
                alert('感謝您的評價！');
                searchOrder(); // 重新整理查詢結果
            } catch (err) {
                alert('送出評價失敗：' + err.message);
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
