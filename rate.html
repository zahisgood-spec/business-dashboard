<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客評價與訂單查詢 - 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入彩帶特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* 稀有閃卡雷射光澤背景 */
        .holo-shine {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 25%, #4facfe 50%, #00f2fe 75%, #ff007f 100%);
            background-size: 400% 400%;
            animation: holoShift 6s ease infinite;
        }
        @keyframes holoShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 刮刮樂畫布樣式 */
        #scratchCanvas {
            touch-action: none;
            cursor: pointer;
        }

        /* 輪播牆動畫 */
        @keyframes scrollWall {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-testimonial {
            display: flex;
            width: max-content;
            animation: scrollWall 25s linear infinite;
        }
        .animate-testimonial:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 py-8">

    <!-- 頂部音效開關控制列 -->
    <div class="w-full max-w-md flex justify-end mb-[-1rem]">
        <button onclick="toggleAudio()" id="audioToggleBtn" class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-full shadow-sm border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
            <i data-lucide="volume-2" class="w-4 h-4 text-indigo-600" id="audioIcon"></i>
            <span id="audioText">音效：開啟</span>
        </button>
    </div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6 my-auto">
        <div class="text-center space-y-2">
            <div class="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="star" class="w-6 h-6 fill-indigo-600"></i>
            </div>
            <h1 class="text-xl font-black text-slate-900">顧客訂單查詢與評價</h1>
            <p class="text-xs text-slate-400">請輸入您的「訂單編號」(例如 OD-001) 來查看訂單並留下寶貴評價</p>
        </div>

        <!-- 查詢表單 -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">訂單編號</label>
                <div class="flex gap-2">
                    <input type="text" id="searchOrderId" placeholder="例如: OD-001" class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase">
                    <button onclick="searchOrder()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">查詢</button>
                </div>
            </div>
        </div>

        <!-- 查詢結果與互動區塊 (預設隱藏) -->
        <div id="resultContainer" class="hidden space-y-4 pt-4 border-t border-slate-100">
            <div class="bg-slate-50 p-4 rounded-2xl space-y-2 border border-slate-100">
                <div class="flex justify-between text-xs text-slate-500">
                    <span>買家: <strong id="resCustomer" class="text-slate-800"></strong></span>
                    <span id="resStatus" class="font-bold"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span id="resProduct" class="font-bold text-slate-900 text-base"></span>
                    <span id="resPrice" class="text-indigo-600 font-bold"></span>
                </div>
            </div>

            <!-- 評價表單 -->
            <div id="ratingSection" class="space-y-3">
                <label class="block text-xs font-semibold text-slate-600">給予商店評分</label>
                <div class="flex justify-center gap-2 py-2" id="starSelector">
                    <button type="button" onclick="setRating(1)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(2)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(3)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(4)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                    <button type="button" onclick="setRating(5)" class="text-2xl text-slate-300 hover:text-amber-400 transition">★</button>
                </div>
                <button onclick="submitRating()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-sm font-bold shadow-sm transition">送出評價並解鎖拉霸</button>
            </div>

            <div id="ratedNotice" class="hidden text-center py-3 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-xl">
                感謝您的評價！您已獲得抽獎與刮刮樂資格。
            </div>

            <!-- 防刷鎖定提示 -->
            <div id="lockedNotice" class="hidden text-center py-4 bg-amber-50 text-amber-800 text-xs font-bold rounded-xl border border-amber-200 space-y-1">
                <div class="flex items-center justify-center gap-1 text-amber-700 font-black">
                    <i data-lucide="shield-alert" class="w-4 h-4"></i> 體驗次數已用盡
                </div>
                <p class="text-[11px] text-amber-600 font-normal">此訂單已經參與過幸運拉霸與刮刮樂囉！每筆訂單僅限參加一次。</p>
            </div>

            <!-- 🎰 賽博拉霸機區塊 -->
            <div id="slotMachineSection" class="hidden space-y-4 pt-4 border-t border-slate-100 text-center bg-gradient-to-b from-slate-900 to-indigo-950 p-5 rounded-2xl text-white shadow-lg">
                <div class="space-y-1">
                    <span class="text-[10px] bg-pink-500 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-widest animate-pulse">Lucky Spin</span>
                    <h2 class="text-base font-black">幸運拉霸開箱活動</h2>
                    <p class="text-[11px] text-slate-300">感謝您的支持！拉動拉霸決定您的專屬刮刮樂獎項</p>
                </div>

                <div class="bg-slate-950 border-2 border-indigo-500/50 rounded-xl p-3 w-40 mx-auto h-20 overflow-hidden relative shadow-inner flex items-center justify-center">
                    <div id="slotReel" class="text-lg font-black text-pink-400 tracking-wider">
                        🎁 準備中
                    </div>
                </div>

                <div id="slotResultText" class="text-xs font-bold text-amber-300 min-h-[18px]"></div>

                <button id="spinBtn" onclick="startSlotSpin()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-md transition">
                    拉下桿子！決定獎項 🎰
                </button>
            </div>

            <!-- 🪙 互動式手動刮刮樂區塊 -->
            <div id="scratchSection" class="hidden space-y-4 pt-4 border-t border-slate-100 text-center bg-slate-900 p-5 rounded-2xl text-white shadow-xl">
                <div class="space-y-1">
                    <span class="text-[10px] bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full font-black uppercase tracking-widest">Interactive Scratch Card</span>
                    <h3 class="text-sm font-black">幸運刮刮樂已就緒</h3>
                    <p class="text-[11px] text-slate-400">請用滑鼠或手指在下方銀漆區域來回刮動！</p>
                </div>

                <!-- 刮刮樂卡片容器 -->
                <div class="relative w-56 h-64 mx-auto rounded-2xl overflow-hidden shadow-2xl border-4 border-amber-300/85">
                    <div class="absolute inset-0 holo-shine flex flex-col items-center justify-between p-4 text-center text-white z-0">
                        <div class="flex justify-between w-full items-center">
                            <span id="cardRarity" class="text-[10px] bg-black/60 px-2 py-0.5 rounded-full font-black text-amber-300 tracking-wider">SSR</span>
                            <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                        </div>
                        <div class="space-y-1 my-auto">
                            <div class="text-3xl" id="cardIcon">💎</div>
                            <h4 id="cardTitle" class="text-sm font-black tracking-wide drop-shadow">極稀有尊榮 VIP</h4>
                            <p id="cardDesc" class="text-[10px] text-slate-100 font-medium drop-shadow-sm">解鎖專屬神祕折扣與頂級權限</p>
                        </div>
                        <span class="text-[9px] bg-black/40 px-2 py-0.5 rounded text-slate-200">展商城限定收藏</span>
                    </div>

                    <canvas id="scratchCanvas" width="224" height="256" class="absolute inset-0 z-10 cursor-crosshair"></canvas>
                </div>

                <div id="scratchStatusText" class="text-xs font-bold text-amber-300">👇 開始動手刮開銀漆吧！</div>

                <button id="downloadCardBtn" onclick="downloadCardImage()" class="hidden w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-md transition flex items-center justify-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i> 下載我的中獎閃卡 (PNG)
                </button>
            </div>
        </div>
    </div>

    <!-- ⭐ 真實買家好評實時輪播牆 -->
    <div class="w-full max-w-xl mt-8 space-y-2 overflow-hidden">
        <div class="flex items-center justify-center gap-1.5 text-xs font-bold text-slate-500 uppercase tracking-widest">
            <i data-lucide="message-square-heart" class="w-4 h-4 text-indigo-600"></i> 買家真實好評牆
        </div>
        <div class="relative w-full overflow-hidden py-2">
            <div class="absolute left-0 top-0 bottom-0 w-12 bg-gradient-to-r from-slate-50 to-transparent z-10 pointer-events-none"></div>
            <div class="absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-l from-slate-50 to-transparent z-10 pointer-events-none"></div>

            <div id="testimonialWall" class="animate-testimonial flex gap-3">
                <div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200 text-xs text-slate-600 shrink-0 flex items-center gap-3">
                    <span class="font-bold text-slate-900">載入中...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjpZ8i-lsWHjrn9wHAOqTFlxKKUWkdZyQ",
            authDomain: "project-1584313366507677848.firebaseapp.com",
            projectId: "project-1584313366507677848",
            storageBucket: "project-1584313366507677848.firebasestorage.app",
            messagingSenderId: "486873849194",
            appId: "1:486873849194:web:3eb6181053f070bda05913",
            measurementId: "G-NYQQKNLE50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentSelectedDocId = null;
        let selectedRating = 5;
        let isScratchedCompleted = false;
        let soundEnabled = true;

        // 🎵 Web Audio API 程式化音效合成器
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.toggleAudio = function() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioText');
            if (soundEnabled) {
                icon.setAttribute('data-lucide', 'volume-2');
                text.innerText = "音效：開啟";
            } else {
                icon.setAttribute('data-lucide', 'volume-x');
                text.innerText = "音效：關閉";
            }
            lucide.createIcons();
        };

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'tick') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400 + Math.random() * 200, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C大調和弦
                    notes.forEach((freq, index) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + index * 0.1);
                        gain.gain.setValueAtTime(0.2, now + index * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + index * 0.1);
                        osc.stop(now + index * 0.1 + 0.3);
                    });
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        const cardPool = [
            { rarity: "SSR", icon: "💎", title: "極稀有尊榮 VIP", desc: "免費升級 0.1秒 VIP 獲得1000robux(0.1秒後失效)" },
            { rarity: "SR", icon: "🎉", title: "超值 9.999 折優惠卡", desc: "下次消費享有全館 9.999 折尊榮折扣" },
            { rarity: "SSR", icon: "🔥", title: "無門檻 1 元金幣", desc: "可直接折抵現金 1 元" },
            { rarity: "R", icon: "🎁", title: "神祕加碼小禮物", desc: "獲得衛生紙一張" },
            { rarity: "SR", icon: "✨", title: "哥布林之星頭銜", desc: "解鎖商城榮譽榜專屬買家頭銜" }
        ];

        let currentCardData = cardPool[0];

        // 🚀 載入好評牆
        async function loadTestimonials() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                let reviews = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.rating && data.rating > 0) {
                        reviews.push({
                            customer: data.customer || "匿名買家",
                            product: data.product || "精選商品",
                            rating: data.rating
                        });
                    }
                });

                const wall = document.getElementById('testimonialWall');
                if (reviews.length === 0) {
                    wall.innerHTML = `<div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200 text-xs text-slate-500 shrink-0">目前尚無評價，快來成為第一位好評買家吧！</div>`;
                    return;
                }

                let htmlContent = '';
                const displayList = [...reviews, ...reviews, ...reviews];
                displayList.forEach(item => {
                    const stars = '★'.repeat(item.rating);
                    htmlContent += `
                        <div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200 text-xs text-slate-700 shrink-0 flex items-center gap-3">
                            <div class="w-8 h-8 bg-indigo-50 text-indigo-600 font-black rounded-xl flex items-center justify-center text-xs">
                                ${item.customer.charAt(0)}
                            </div>
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-slate-900">${item.customer}</span>
                                    <span class="text-amber-400 text-[10px]">${stars}</span>
                                </div>
                                <p class="text-[11px] text-slate-400">購買：${item.product}</p>
                            </div>
                        </div>
                    `;
                });
                wall.innerHTML = htmlContent;
            } catch (e) {
                console.error("載入好評牆失敗", e);
            }
        }

        loadTestimonials();

        window.searchOrder = async function() {
            playSound('click');
            const queryId = document.getElementById('searchOrderId').value.trim().toUpperCase();
            if (!queryId) {
                alert('請輸入訂單編號！');
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                let found = null;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.id && data.id.toUpperCase() === queryId) {
                        found = { docId: docSnap.id, ...data };
                    }
                });

                if (!found) {
                    alert('找不到此訂單編號，請確認後再試一次！');
                    document.getElementById('resultContainer').classList.add('hidden');
                    return;
                }

                currentSelectedDocId = found.docId;
                document.getElementById('resCustomer').innerText = found.customer;
                document.getElementById('resProduct').innerText = found.product;
                document.getElementById('resPrice').innerText = `NT$${Number(found.price).toLocaleString()}`;
                document.getElementById('resStatus').innerText = found.status;

                const ratingSec = document.getElementById('ratingSection');
                const ratedNotice = document.getElementById('ratedNotice');
                const slotSection = document.getElementById('slotMachineSection');
                const scratchSection = document.getElementById('scratchSection');
                const lockedNotice = document.getElementById('lockedNotice');

                slotSection.classList.add('hidden');
                scratchSection.classList.add('hidden');
                lockedNotice.classList.add('hidden');

                if (found.hasPlayed) {
                    ratingSec.classList.add('hidden');
                    ratedNotice.classList.add('hidden');
                    lockedNotice.classList.remove('hidden');
                } else if (found.rating && found.rating > 0) {
                    ratingSec.classList.add('hidden');
                    ratedNotice.classList.remove('hidden');
                    slotSection.classList.remove('hidden');
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('spinBtn').innerText = "拉下桿子！決定獎項 🎰";
                    document.getElementById('slotReel').innerHTML = `🎁 準備中`;
                    document.getElementById('slotResultText').innerHTML = "";
                } else {
                    ratingSec.classList.remove('hidden');
                    ratedNotice.classList.add('hidden');
                    setRating(5);
                }

                document.getElementById('resultContainer').classList.remove('hidden');
                lucide.createIcons();
            } catch (e) {
                alert('查詢發生錯誤：' + e.message);
            }
        };

        window.setRating = function(stars) {
            playSound('click');
            selectedRating = stars;
            const buttons = document.querySelectorAll('#starSelector button');
            buttons.forEach((btn, index) => {
                if (index < stars) {
                    btn.className = 'text-2xl text-amber-400 transition';
                } else {
                    btn.className = 'text-2xl text-slate-300 hover:text-amber-400 transition';
                }
            });
        };

        window.submitRating = async function() {
            playSound('click');
            if (!currentSelectedDocId) return;
            try {
                const orderRef = doc(db, "orders", currentSelectedDocId);
                await updateDoc(orderRef, { rating: selectedRating });
                
                document.getElementById('ratingSection').classList.add('hidden');
                document.getElementById('ratedNotice').classList.remove('hidden');
                document.getElementById('slotMachineSection').classList.remove('hidden');
                
                const spinBtn = document.getElementById('spinBtn');
                spinBtn.disabled = false;
                spinBtn.innerText = "拉下桿子！決定獎項 🎰";
                document.getElementById('slotReel').innerHTML = `🎁 準備中`;
                document.getElementById('slotResultText').innerHTML = "";
                document.getElementById('scratchSection').classList.add('hidden');

                lucide.createIcons();
                loadTestimonials();

                try {
                    confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
                } catch (e) {}

            } catch (err) {
                alert('送出評價失敗：' + err.message);
            }
        };

        window.startSlotSpin = async function() {
            playSound('click');
            const spinBtn = document.getElementById('spinBtn');
            const reel = document.getElementById('slotReel');
            const resultText = document.getElementById('slotResultText');
            spinBtn.disabled = true;
            resultText.innerText = "拉霸高速轉動中...";

            let counter = 0;
            const interval = setInterval(async () => {
                playSound('tick');
                const randomCard = cardPool[Math.floor(Math.random() * cardPool.length)];
                reel.innerHTML = `<span>${randomCard.icon} ${randomCard.title}</span>`;
                counter++;
                if (counter > 14) {
                    clearInterval(interval);
                    
                    currentCardData = cardPool[Math.floor(Math.random() * cardPool.length)];
                    reel.innerHTML = `<span class="text-amber-300 scale-110">${currentCardData.icon} ${currentCardData.title}</span>`;
                    resultText.innerText = `🔥 拉霸成功！請往下刮開您的專屬獎項！`;
                    spinBtn.innerText = "已完成拉霸";
                    playSound('win');

                    document.getElementById('cardRarity').innerText = currentCardData.rarity;
                    document.getElementById('cardIcon').innerText = currentCardData.icon;
                    document.getElementById('cardTitle').innerText = currentCardData.title;
                    document.getElementById('cardDesc').innerText = currentCardData.desc;

                    try {
                        if (currentSelectedDocId) {
                            const orderRef = doc(db, "orders", currentSelectedDocId);
                            await updateDoc(orderRef, { hasPlayed: true });
                        }
                    } catch (e) {
                        console.error("防刷鎖定寫入失敗", e);
                    }

                    setTimeout(() => {
                        const scratchSec = document.getElementById('scratchSection');
                        scratchSec.classList.remove('hidden');
                        scratchSec.scrollIntoView({ behavior: 'smooth' });
                        initScratchCanvas();
                        lucide.createIcons();
                    }, 500);

                    try {
                        confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
                    } catch (e) {}
                }
            }, 100);
        };

        function initScratchCanvas() {
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d');
            isScratchedCompleted = false;
            document.getElementById('downloadCardBtn').classList.add('hidden');
            document.getElementById('scratchStatusText').innerText = "👇 開始動手刮開銀漆吧！";

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#64748b';
            for (let i = 0; i < 3000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillRect(x, y, 1.5, 1.5);
            }

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 16px "Inter", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✨ 幸運刮刮樂 ✨', canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '12px "Inter", sans-serif';
            ctx.fillText('(按住並滑動手指刮開)', canvas.width / 2, canvas.height / 2 + 15);

            let isDrawing = false;

            function scratch(x, y) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 22, 0, Math.PI * 2, false);
                ctx.fill();
                checkScratchProgress();
            }

            function getPosition(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            canvas.onmousedown = (e) => { isDrawing = true; const pos = getPosition(e); scratch(pos.x, pos.y); };
            canvas.onmousemove = (e) => { if (!isDrawing) return; const pos = getPosition(e); scratch(pos.x, pos.y); };
            window.onmouseup = () => { isDrawing = false; };

            canvas.ontouchstart = (e) => { isDrawing = true; const pos = getPosition(e); scratch(pos.x, pos.y); e.preventDefault(); };
            canvas.ontouchmove = (e) => { if (!isDrawing) return; const pos = getPosition(e); scratch(pos.x, pos.y); e.preventDefault(); };
            canvas.ontouchend = () => { isDrawing = false; };
        }

        function checkScratchProgress() {
            if (isScratchedCompleted) return;
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d');
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 16) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const totalPixels = pixels.length / 16;
            if (transparentPixels / totalPixels > 0.35) {
                isScratchedCompleted = true;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                document.getElementById('scratchStatusText').innerHTML = "🎉 恭喜中獎！您可以下載閃卡截圖私訊老闆兌換！";
                document.getElementById('downloadCardBtn').classList.remove('hidden');
                playSound('win');
                lucide.createIcons();

                try {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                } catch (e) {}
            }
        }

        window.downloadCardImage = function() {
            playSound('click');
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            const bgGrad = ctx.createLinearGradient(0, 0, 600, 800);
            bgGrad.addColorStop(0, '#ff007f');
            bgGrad.addColorStop(0.25, '#7928ca');
            bgGrad.addColorStop(0.5, '#4facfe');
            bgGrad.addColorStop(0.75, '#00f2fe');
            bgGrad.addColorStop(1, '#ff007f');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 600, 800);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.beginPath();
            ctx.roundRect(30, 30, 540, 740, 24);
            ctx.fill();

            ctx.lineWidth = 6;
            ctx.strokeStyle = '#fde047';
            ctx.stroke();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.beginPath();
            ctx.roundRect(60, 65, 110, 45, 22);
            ctx.fill();

            ctx.fillStyle = '#fde047';
            ctx.font = 'bold 22px "Inter", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(currentCardData.rarity, 115, 95);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 80px sans-serif';
            ctx.fillText(currentCardData.icon, 300, 300);

            ctx.font = 'bold 36px "Inter", sans-serif';
            ctx.fillText(currentCardData.title, 300, 410);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '20px "Inter", sans-serif';
            ctx.fillText(currentCardData.desc, 300, 470);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.roundRect(150, 630, 300, 55, 16);
            ctx.fill();

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 16px "Inter", sans-serif';
            ctx.fillText('展商城限定專屬刮刮樂收藏卡', 300, 665);

            const link = document.createElement('a');
            link.download = `ScratchCard_${currentCardData.rarity}_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        lucide.createIcons();
    </script>
</body>
</html>
