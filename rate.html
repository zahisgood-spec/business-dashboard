<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客滿意度評分系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen items-center justify-center p-4 overflow-hidden">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i data-lucide="star" class="w-6 h-6 fill-current"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900">顧客滿意度評分系統</h2>
            <p class="text-xs text-slate-500">請輸入您的訂單編號 (例如 OD-001) 以進行商品評分</p>
        </div>

        <!-- 步驟 1：輸入訂單編號 -->
        <div id="cust-step-search" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">訂單編號</label>
                <input type="text" id="cust-inputOrderId" placeholder="例如: OD-001" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono uppercase">
            </div>
            <button onclick="custSearchOrder()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-md transition">
                查詢訂單
            </button>
            <p id="cust-search-error" class="text-xs text-rose-500 text-center hidden">找不到此訂單編號，請確認後再試一次！</p>
        </div>

        <!-- 步驟 2：進行評分 -->
        <div id="cust-step-rate" class="space-y-4 hidden">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-2 text-xs">
                <div class="flex justify-between"><span class="text-slate-400">訂單編號：</span><span id="cust-info-id" class="font-mono font-bold text-slate-700"></span></div>
                <div class="flex justify-between"><span class="text-slate-400">買家帳號：</span><span id="cust-info-customer" class="font-semibold text-slate-700"></span></div>
                <div class="flex justify-between"><span class="text-slate-400">購買商品：</span><span id="cust-info-product" class="font-semibold text-slate-700"></span></div>
            </div>

            <div class="space-y-2 text-center py-2">
                <label class="block text-xs font-semibold text-slate-600">請點擊星星給予評價</label>
                <div id="cust-star-picker" class="flex justify-center gap-2 text-3xl cursor-pointer text-slate-300">
                    <span onclick="custSetStars(1)">★</span>
                    <span onclick="custSetStars(2)">★</span>
                    <span onclick="custSetStars(3)">★</span>
                    <span onclick="custSetStars(4)">★</span>
                    <span onclick="custSetStars(5)">★</span>
                </div>
                <p id="cust-rating-text" class="text-xs font-medium text-amber-500">請選擇星數</p>
            </div>

            <button onclick="custSubmitRating()" id="cust-submit-btn" disabled class="w-full py-3 bg-slate-300 text-white rounded-xl text-sm font-semibold transition cursor-not-allowed">
                送出評價
            </button>
            <button onclick="custResetSearch()" class="w-full text-xs text-slate-400 hover:text-slate-600 text-center pt-2">
                ← 重新輸入訂單編號
            </button>
        </div>

        <!-- 步驟 3：成功畫面 -->
        <div id="cust-step-success" class="text-center space-y-4 hidden py-6">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                ✓
            </div>
            <h3 class="text-lg font-bold text-slate-900">感謝您的評價！</h3>
            <p class="text-xs text-slate-500">您的星數已成功同步至商務管理系統。</p>
            <button onclick="custResetSearch()" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition">
                返回重新查詢
            </button>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem('storebuddy_real_orders')) || [];
        let custSelectedOrderId = null;
        let custCurrentRating = 0;

        // 支援網址自動帶入 ?id=OD-001
        window.onload = function() {
            lucide.createIcons();
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            if (idParam) {
                document.getElementById('cust-inputOrderId').value = idParam;
                custSearchOrder();
            }
        };

        function custSearchOrder() {
            const inputId = document.getElementById('cust-inputOrderId').value.trim().toUpperCase();
            const errEl = document.getElementById('cust-search-error');
            
            orders = JSON.parse(localStorage.getItem('storebuddy_real_orders')) || [];
            const found = orders.find(o => o.id.toUpperCase() === inputId);

            if (!found) {
                errEl.classList.remove('hidden');
                return;
            }

            errEl.classList.add('hidden');
            custSelectedOrderId = found.id;

            document.getElementById('cust-info-id').innerText = found.id;
            document.getElementById('cust-info-customer').innerText = found.customer;
            document.getElementById('cust-info-product').innerText = found.product;

            document.getElementById('cust-step-search').classList.add('hidden');
            document.getElementById('cust-step-rate').classList.remove('hidden');
            
            custSetStars(found.rating || 5);
        }

        function custSetStars(star) {
            custCurrentRating = star;
            const stars = document.querySelectorAll('#cust-star-picker span');
            stars.forEach((el, idx) => {
                if (idx < star) {
                    el.classList.remove('text-slate-300');
                    el.classList.add('text-amber-400');
                } else {
                    el.classList.remove('text-amber-400');
                    el.classList.add('text-slate-300');
                }
            });

            const texts = ['', '1 星 - 非常不滿意', '2 星 - 有待加強', '3 星 - 普通', '4 星 - 滿意', '5 星 - 非常滿意！'];
            document.getElementById('cust-rating-text').innerText = texts[star];

            const btn = document.getElementById('cust-submit-btn');
            btn.disabled = false;
            btn.className = "w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-md transition cursor-pointer";
        }

        function custSubmitRating() {
            if (!custSelectedOrderId || custCurrentRating === 0) return;

            orders = orders.map(o => o.id === custSelectedOrderId ? { ...o, rating: custCurrentRating } : o);
            localStorage.setItem('storebuddy_real_orders', JSON.stringify(orders));

            document.getElementById('cust-step-rate').classList.add('hidden');
            document.getElementById('cust-step-success').classList.remove('hidden');
        }

        function custResetSearch() {
            custSelectedOrderId = null;
            custCurrentRating = 0;
            document.getElementById('cust-inputOrderId').value = '';
            document.getElementById('cust-step-success').classList.add('hidden');
            document.getElementById('cust-step-rate').classList.add('hidden');
            document.getElementById('cust-step-search').classList.remove('hidden');
        }
    </script>
</body>
</html>
