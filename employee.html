<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展商城 員工接單站</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--navy:#1a1a5e;--teal:#26c6b9;--red:#e8392b;--amber:#f59e0b}
html{scroll-behavior:smooth}
body{font-family:system-ui,"Noto Sans TC",sans-serif;color:#0f172a;background:#eef1fb;min-height:100vh}
body::before,body::after{content:'';position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none}
body::before{top:-12%;left:-8%;width:520px;height:520px;background:rgba(38,198,185,.28);animation:blob 18s ease-in-out infinite}
body::after{bottom:-14%;right:-8%;width:560px;height:560px;background:rgba(232,57,43,.16);animation:blob 22s ease-in-out infinite reverse}
@keyframes blob{50%{transform:translate(40px,-30px) scale(1.12)}}
.hero{background:radial-gradient(circle at 15% 10%,#2d2d9a 0%,#1a1a5e 55%,#0d0d33 100%)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheen{to{transform:translateX(130%)}}
.card{position:relative;overflow:hidden;animation:up .55s cubic-bezier(.16,1,.3,1) backwards;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 26px 44px -22px rgba(26,26,94,.45)}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--teal),var(--red),var(--amber))}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.card:hover::after{animation:sheen .9s ease}
.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px -18px rgba(26,26,94,.35)}
@keyframes glow{0%,100%{box-shadow:0 8px 22px -6px rgba(249,115,22,.55)}50%{box-shadow:0 8px 34px -2px rgba(249,115,22,.95)}}
.claim{background:linear-gradient(135deg,#fb923c,#ea580c);animation:glow 2.2s infinite;position:relative;overflow:hidden}
.claim::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 2.6s infinite}
.tab{padding:.75rem 1.5rem;border-radius:1rem;font-weight:800;color:#64748b;transition:all .25s}
.tab:hover{color:var(--navy);transform:translateY(-2px)}
.tab.on{background:linear-gradient(135deg,#2d2d9a,#1a1a5e);color:#fff;box-shadow:0 12px 24px -10px rgba(26,26,94,.7)}
.pill{font-size:11px;font-weight:800;padding:.2rem .65rem;border-radius:9999px}
.s0{background:#fee2e2;color:#b91c1c}.s1{background:#dbeafe;color:#1d4ed8}.s2{background:#fef3c7;color:#b45309}.s3{background:#d1fae5;color:#047857}
.stat{transition:transform .3s}.stat:hover{transform:translateY(-4px)}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.float{animation:float 3.6s ease-in-out infinite}
#toast{backdrop-filter:blur(10px)}
#p.mask{-webkit-text-security:disc;text-security:disc}

/* ✨ 質感升級 */
body{background-color:#eef1fb;background-image:radial-gradient(rgba(26,26,94,.07) 1px,transparent 1px);background-size:22px 22px}
.logo3{position:relative;width:38px;height:38px}
.logo3 i{position:absolute;width:20px;height:24px;border-radius:5px 5px 6px 6px;box-shadow:0 4px 10px -2px rgba(0,0,0,.4)}
.logo3 i:nth-child(1){left:0;top:8px;background:#26c6b9;transform:rotate(-10deg)}.logo3 i:nth-child(2){left:9px;top:2px;background:#e8392b;z-index:1}.logo3 i:nth-child(3){left:18px;top:8px;background:#f59e0b;transform:rotate(10deg)}
.chip-u{display:flex;align-items:center;gap:.6rem;padding:.3rem .9rem .3rem .3rem;border-radius:9999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-weight:800;font-size:.85rem}
.av{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:900;color:#fff;font-size:.85rem;flex:none}
.banner{position:relative;overflow:hidden;border-radius:2rem;padding:1.8rem 2rem;color:#fff;background:radial-gradient(circle at 10% 0%,#3b3bb8 0%,#1a1a5e 50%,#0d0d33 100%);box-shadow:0 30px 60px -30px rgba(26,26,94,.8)}
.banner::before,.banner::after{content:'';position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none}
.banner::before{width:260px;height:260px;right:-60px;top:-80px;background:rgba(38,198,185,.55);animation:blob 14s ease-in-out infinite}
.banner::after{width:240px;height:240px;right:180px;bottom:-120px;background:rgba(232,57,43,.4);animation:blob 18s ease-in-out infinite reverse}
.bst{position:relative;z-index:1;min-width:112px;padding:.85rem 1.1rem;border-radius:1.2rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);transition:transform .3s}
.bst:hover{transform:translateY(-4px) scale(1.03)}
.bst b{display:block;font-size:2.1rem;line-height:1.1;font-weight:900}
.tk{filter:drop-shadow(0 14px 18px rgba(26,26,94,.16));transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .18s ease-out,filter .3s;animation:up .6s cubic-bezier(.16,1,.3,1) backwards}
.tk:hover{--ty:-6px;filter:drop-shadow(0 26px 26px rgba(26,26,94,.28))}
.ticket{position:relative;background:linear-gradient(180deg,#fff 0%,#f8faff 100%);border-radius:1.5rem;overflow:hidden;
 -webkit-mask:radial-gradient(circle 11px at 0 calc(100% - 88px),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% calc(100% - 88px),#0000 97%,#000) right/51% 100% no-repeat;
 mask:radial-gradient(circle 11px at 0 calc(100% - 88px),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% calc(100% - 88px),#0000 97%,#000) right/51% 100% no-repeat}
.ticket::before{content:'';display:block;height:6px;background:linear-gradient(90deg,#26c6b9,#e8392b,#f59e0b)}
.ticket::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.tk:hover .ticket::after{animation:sheen .9s ease}
.tk .tb{padding:1.2rem 1.4rem 1.1rem}
.tk .bt{height:88px;border-top:2px dashed #d5dbee;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:0 1.3rem}
.idc{font-family:ui-monospace,monospace;font-weight:800;font-size:.75rem;padding:.25rem .65rem;border-radius:.6rem;background:#eef1fb;color:#1a1a5e}
.pav{display:grid;place-items:center;width:52px;height:52px;border-radius:1rem;font-size:1.4rem;font-weight:900;color:#fff;flex:none;box-shadow:0 10px 18px -8px rgba(26,26,94,.55)}
.ptitle{font-weight:900;font-size:1.2rem;line-height:1.25;color:#0f172a}
.price{font-size:1.9rem;font-weight:900;line-height:1;background:linear-gradient(135deg,#047857,#26c6b9);-webkit-background-clip:text;background-clip:text;color:transparent}
.nb{font-size:10px;font-weight:900;padding:.2rem .55rem;border-radius:9999px;color:#fff}
.go{display:inline-flex;align-items:center;gap:.4rem;padding:.8rem 1.3rem;border-radius:1rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff8a3d,#e8392b);box-shadow:0 12px 22px -10px rgba(232,57,43,.8);transition:transform .2s,box-shadow .2s,gap .2s}
.go:hover{transform:translateY(-2px);gap:.8rem;box-shadow:0 16px 26px -10px rgba(232,57,43,.95)}.go:active{transform:scale(.95)}
.note{display:flex;gap:.5rem;margin-top:.8rem;padding:.55rem .75rem;border-radius:.9rem;background:#fff8dc;color:#8a6d00;font-size:.75rem;font-weight:600;border-left:4px solid #f59e0b}
.stp{display:flex;align-items:center;margin:1rem 0 .4rem}
.stp .n{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:none;width:58px;font-size:10px;font-weight:800;color:#94a3b8}
.stp .n u{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#fff;font-size:.7rem;text-decoration:none}
.stp .n.d{color:#047857}.stp .n.d u{background:linear-gradient(135deg,#26c6b9,#047857)}
.stp .n.c u{background:linear-gradient(135deg,#ff8a3d,#e8392b);box-shadow:0 0 0 5px rgba(232,57,43,.18);animation:pulse2 1.8s infinite}
.stp .l{flex:1;height:4px;border-radius:4px;background:#e2e8f0;margin-bottom:1.1rem}.stp .l.d{background:linear-gradient(90deg,#26c6b9,#047857)}
@keyframes pulse2{50%{box-shadow:0 0 0 9px rgba(232,57,43,0)}}
.bub{display:inline-block;max-width:100%;padding:.45rem .8rem;border-radius:1rem 1rem 1rem .3rem;background:linear-gradient(135deg,#eef2ff,#e0e7ff);color:#312e81;font-size:.8rem}
.bub small{color:#818cf8;margin-left:.4rem}

/* 🎬 Logo / 動畫升級 */
.lgm{width:46px;height:46px;border-radius:14px;background:#fff url(logo.png) no-repeat;background-size:118px;background-position:-37px 5px;box-shadow:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.25);animation:sway 4s ease-in-out infinite;flex:none}
@keyframes sway{50%{transform:rotate(-6deg) scale(1.06)}}
.lgin{width:200px;max-width:70%;margin:0 auto;display:block;animation:lgpop 1s cubic-bezier(.34,1.56,.64,1) backwards,float 4s 1s ease-in-out infinite}
@keyframes lgpop{from{opacity:0;transform:scale(.3) rotate(-12deg)}}
#splash{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:radial-gradient(circle at 50% 40%,#2d2d9a 0%,#1a1a5e 50%,#06061c 100%)}
#splash.on{display:grid;animation:spl 2s ease forwards}
@keyframes spl{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0;visibility:hidden}}
#splash .box{position:relative;text-align:center}
#splash .card2{background:#fff;border-radius:2rem;padding:1.5rem 2rem;box-shadow:0 30px 80px -10px rgba(38,198,185,.55);animation:lgpop .9s cubic-bezier(.34,1.56,.64,1) backwards}
#splash img{width:220px;display:block}
#splash .ring{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px;border-radius:50%;border:3px solid;opacity:0;animation:ring 1.6s ease-out infinite}
#splash .ring:nth-child(1){border-color:#26c6b9}#splash .ring:nth-child(2){border-color:#e8392b;animation-delay:.3s}#splash .ring:nth-child(3){border-color:#f59e0b;animation-delay:.6s}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
#splash .bar{margin:1.4rem auto 0;width:220px;height:5px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#26c6b9,#e8392b,#f59e0b);animation:fill 1.5s .2s ease forwards}
@keyframes fill{to{width:100%}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.go,.tab,#go{position:relative;overflow:hidden}
.tk.fly{animation:fly .55s cubic-bezier(.5,0,.75,0) forwards!important;pointer-events:none}
@keyframes fly{40%{filter:drop-shadow(0 0 30px #f59e0b)}to{transform:translateY(-70px) scale(.7) rotate(5deg);opacity:0;filter:blur(3px)}}
.swap{animation:swap .5s cubic-bezier(.16,1,.3,1)}
@keyframes swap{from{opacity:0;transform:translateX(24px)}}
.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.35)}}
.fl{position:fixed;bottom:-80px;z-index:-1;border-radius:50%;animation:rise linear infinite;opacity:0}
@keyframes rise{10%{opacity:.5}90%{opacity:.35}100%{transform:translateY(-115vh) translateX(40px);opacity:0}}
</style>

<body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,collection,doc,getDoc,updateDoc,onSnapshot,runTransaction,arrayUnion} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyBjpZ8i-lsWHjrn9wHAOqTFlxKKUWkdZyQ",authDomain:"project-1584313366507677848.firebaseapp.com",projectId:"project-1584313366507677848",storageBucket:"project-1584313366507677848.firebasestorage.app",messagingSenderId:"486873849194",appId:"1:486873849194:web:3eb6181053f070bda05913"}));
const $=id=>document.getElementById(id);
const E=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const STATUS=['未付款','已付款(未出貨)','待發貨','已完成發貨'];
const ITER=120000;
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pwHash(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(salt),iterations:iter},k,256))}
const half=v=>v.replace(/[\uFF01-\uFF5E]/g,x=>String.fromCharCode(x.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' ');
const toast=m=>{const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200)};
let me=null,orders=[],unsub=null,ready=false,sound=true;

let AC;const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(!b.dataset.claim&&!b.id.startsWith('t-')&&b.id!=='go')sfx('tick');if(b.matches('.go,.tab,#go')){const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),650)}},true);
['#26c6b9','#e8392b','#f59e0b','#7c5cff'].forEach((c,i)=>{for(let k=0;k<3;k++){const f=document.createElement('span');f.className='fl';const z=18+Math.random()*46;f.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}vw;background:${c};filter:blur(${2+Math.random()*6}px);animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;document.body.appendChild(f)}});
function tone(f,t0,d,type='sine',v=.12,to){if(!sound)return;try{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={tick:()=>tone(1500,0,.035,'sine',.04),pop:()=>{tone(620,0,.09,'triangle',.12,980)},tab:()=>tone(380,0,.18,'sine',.09,1100),
 ding:()=>{tone(1319,0,.5,'sine',.14);tone(1760,.12,.6,'sine',.12)},success:()=>[523,659,784].forEach((f,i)=>tone(f,i*.09,.3,'triangle',.13)),
 fanfare:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.4,'triangle',.14)),error:()=>{tone(220,0,.25,'sawtooth',.1,110);tone(180,.14,.3,'sawtooth',.09,90)},
 whoosh:()=>{tone(200,0,.7,'sine',.1,1600);tone(100,0,.7,'triangle',.06,800)}};
const sfx=n=>{if(sound&&SFX[n])SFX[n]()};
const beep=()=>sfx('ding');
function splash(name){$('spt').textContent='歡迎回來，'+name;const e=$('splash');e.classList.remove('on');void e.offsetWidth;e.classList.add('on');sfx('whoosh');setTimeout(()=>sfx('success'),900)}

// ---- 登入 ----
let busy=false;
async function login(){
  if(busy)return;
  const name=$('u').value.trim(),pw=$('p').value;$('err').textContent='';
  if(!name||!pw){$('err').textContent='請輸入帳號與密碼';return}
  busy=true;$('go').disabled=true;
  try{
    const s=await getDoc(doc(db,'staff',encodeURIComponent(name.toLowerCase())));
    const a=s.exists()?s.data():null;
    let ok=false;
    if(a&&a.active!==false){
      // 依序嘗試：原樣 → 全形轉半形 → 再去頭尾空白（手機輸入法常會多塞空白）
      for(const c of new Set([pw,half(pw),half(pw).trim()])){
        if(c&&(await pwHash(c,a.salt,a.iter||ITER))===a.hash){ok=true;break}
      }
    }
    if(!ok){$('err').textContent='帳號或密碼錯誤，或帳號已停用';sfx('error');return}
    me={id:s.id,name:a.displayName||name};sessionStorage.setItem('zahStaff',JSON.stringify(me));enter();
  }catch(e){$('err').textContent='登入失敗：'+e.message}
  finally{busy=false;$('go').disabled=false}
}
async function enter(){
  splash(me.name);
  $('gate').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='👤 '+me.name;
  unsub&&unsub();ready=false;
  unsub=onSnapshot(collection(db,'orders'),snap=>{
    orders=snap.docs.map(d=>({docId:d.id,...d.data()})).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    if(ready)snap.docChanges().forEach(c=>{if(c.type==='added'){beep();toast('🔔 新訂單 '+(c.doc.data().id||''))}});
    ready=true;render();
  });
}
// 用 CSS 遮蔽（type=text）才能用注音/中文輸入法；瀏覽器不支援時（如 Firefox）退回 type=password
const canMask=!!(window.CSS&&CSS.supports&&(CSS.supports('-webkit-text-security','disc')||CSS.supports('text-security','disc')));
let hidden=true;
function applyMask(){
  const i=$('p');
  if(canMask){i.type='text';i.classList.toggle('mask',hidden)}else{i.type=hidden?'password':'text'}
  $('eye').textContent=hidden?'👁 顯示密碼':'🙈 把密碼遮起來';
}
$('eye').onclick=()=>{hidden=!hidden;applyMask();$('p').focus()};
applyMask();
if(!window.isSecureContext)$('err').textContent='⚠️ 目前不是安全連線（https / localhost），登入驗證可能無法運作';
// 帳號欄：全形自動轉半形（輸入法組字中不動，組字完成後才轉，避免打字被打斷）
const fixU=()=>{const el=$('u'),v=half(el.value);if(v!==el.value){const p=el.selectionStart;el.value=v;el.setSelectionRange(p,p)}};
$('u').addEventListener('input',e=>{if(!e.isComposing)fixU()});
$('u').addEventListener('compositionend',fixU);
// 密碼欄不在輸入時修改內容，轉換改在登入時比對
$('go').onclick=login;
// 輸入法選字按 Enter 時（isComposing / keyCode 229）不能當成送出
$('p').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229)login()};
$('out').onclick=()=>{sessionStorage.removeItem('zahStaff');location.reload()};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔔 提示音開':'🔕 提示音關'};
const tab=t=>{sfx('tab');['pool','mine'].forEach(n=>{$(n).classList.toggle('hidden',n!==t);$('t-'+n).classList.toggle('on',n===t)});const e=$(t);e.classList.remove('swap');void e.offsetWidth;e.classList.add('swap')};
$('t-pool').onclick=()=>tab('pool');$('t-mine').onclick=()=>tab('mine');

// ---- 畫面 ----
function countTo(id,v){const el=$(id),from=+el.textContent||0;if(from===v)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/500);el.textContent=Math.round(from+(v-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
const party=()=>window.confetti&&confetti({particleCount:110,spread:80,origin:{y:.7},colors:['#26c6b9','#e8392b','#f59e0b','#1a1a5e']});
const hue=t=>{let h=0;for(const c of String(t||''))h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+40)%360} 75% 42%))`};
const ago=d=>{const m=Math.max(0,Math.round((Date.now()-new Date(String(d).replace(' ','T')))/60000));return isNaN(m)?'':m<1?'剛剛':m<60?m+' 分鐘前':m<1440?Math.floor(m/60)+' 小時前':Math.floor(m/1440)+' 天前'};
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('.tk');document.querySelectorAll('.tk').forEach(x=>{if(x!==t){x.style.setProperty('--rx','0deg');x.style.setProperty('--ry','0deg')}});if(!t)return;const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;t.style.setProperty('--ry',(px*7)+'deg');t.style.setProperty('--rx',(-py*7)+'deg')});
const tick=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');const c=$('clk');if(c)c.textContent=`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};tick();setInterval(tick,20000);
function render(){
  const pool=orders.filter(o=>!o.assignee&&o.status!=='已完成發貨'&&o.quoteState!=='pending');
  const mine=orders.filter(o=>o.assignee===me.id);
  $('n-pool').textContent=pool.length;countTo('s-pool',pool.length);countTo('s-mine',mine.filter(o=>o.status!=='已完成發貨').length);countTo('s-done',mine.filter(o=>o.status==='已完成發貨').length);$('n-mine').textContent=mine.filter(o=>o.status!=='已完成發貨').length;
  const h=new Date().getHours();
  $('hello').textContent=(h<6?'夜深了':h<12?'早安':h<18?'午安':'晚安')+'，'+me.name+' 👋';
  $('hello2').textContent=pool.length?`大廳有 ${pool.length} 張訂單等你接，手腳快的先搶先贏！`:'目前沒有待接訂單，喝口水休息一下吧 ☕';
  $('who').innerHTML=`<span class="av" style="background:${hue(me.name)}">${E([...me.name][0]||'?')}</span>${E(me.name)}`;
  $('pool').innerHTML=pool.length?`<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-6">${pool.map((o,i)=>{const pr=Number(o.price||0),mins=(Date.now()-new Date(String(o.date).replace(' ','T')))/60000;return`
   <div class="tk" style="animation-delay:${Math.min(i,8)*70}ms"><div class="ticket">
    <div class="tb">
     <div class="flex items-center justify-between gap-2"><span class="idc">#${E(o.id)}</span><div class="flex items-center gap-1.5">${mins<30?'<span class="nb" style="background:linear-gradient(135deg,#ff8a3d,#e8392b)">NEW</span>':''}${pr>=2000?'<span class="nb" style="background:linear-gradient(135deg,#f59e0b,#b45309)">💎 大單</span>':''}<span class="pill s${STATUS.indexOf(o.status)}">${E(o.status)}</span></div></div>
     <div class="flex items-center gap-3.5 mt-4"><div class="pav" style="background:${hue(o.product)}">${E([...String(o.product||'?')][0])}</div><div class="min-w-0"><div class="ptitle break-words">${E(o.product)}</div><div class="flex items-center gap-1.5 mt-1.5 text-xs font-bold text-slate-500"><span class="av !w-5 !h-5 !text-[10px]" style="background:${hue(o.customer)}">${E([...String(o.customer||'?')][0])}</span>${E(o.customer)}</div></div></div>
     ${o.memo?`<div class="note"><span>📌</span><span>${E(o.memo)}</span></div>`:''}
     <div class="mt-3 text-[11px] font-bold text-slate-400">🕒 ${ago(o.date)} · ${E(o.date)}</div>
    </div>
    <div class="bt"><div><div class="text-[10px] font-black tracking-widest text-slate-400">訂單金額</div><div class="price mt-1">NT$${pr.toLocaleString()}</div></div><button data-claim="${o.docId}" class="go">接單 <span>→</span></button></div>
   </div></div>`}).join('')}</div>`:`<div class="text-center py-24"><div class="text-7xl mb-4 float">☕</div><div class="font-black text-xl text-slate-700">目前沒有待接訂單</div><div class="text-sm text-slate-400 mt-1">新訂單進來會有提示音與通知</div></div>`;
  const SN=['未付款','已付款','待發貨','已出貨'];
  $('mine').innerHTML=mine.length?`<div class="grid lg:grid-cols-2 gap-6">${mine.map((o,i)=>{const k=Math.max(0,STATUS.indexOf(o.status));return`
   <div class="tk" style="animation-delay:${Math.min(i,8)*70}ms"><div class="ticket"><div class="tb">
    <div class="flex items-start justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><div class="pav" style="background:${hue(o.product)}">${E([...String(o.product||'?')][0])}</div><div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="idc">#${E(o.id)}</span><span class="pill s${k}">${E(o.status)}</span></div><div class="ptitle mt-1 break-words">${E(o.product)}</div><div class="text-xs font-bold text-slate-500 mt-1">👤 ${E(o.customer)} · ${E(o.date)}</div></div></div><div class="price shrink-0">NT$${Number(o.price||0).toLocaleString()}</div></div>
    <div class="stp">${SN.map((n,j)=>`${j?`<div class="l ${j<=k?'d':''}"></div>`:''}<div class="n ${j<k?'d':j===k?'c':''}"><u>${j<k?'✓':j+1}</u>${n}</div>`).join('')}</div>
    <div class="flex items-center gap-2 mt-2"><span class="text-xs font-black text-slate-500">更新狀態</span><select data-st="${o.docId}" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 bg-white font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-400">${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>
    ${o.memo?`<div class="note"><span>📌</span><span>管理員備註：${E(o.memo)}</span></div>`:''}
    <div class="mt-3 space-y-1.5">${(o.staffNotes||[]).map(n=>`<div><span class="bub"><b>${E(n.by)}</b>：${E(n.text)}<small>${E(n.at)}</small></span></div>`).join('')}</div>
    <div class="flex gap-2 mt-3"><input id="nt-${o.docId}" placeholder="寫下處理備註…" class="flex-1 px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-400"><button data-note="${o.docId}" class="px-4 rounded-xl hero text-white text-sm font-bold hover:brightness-125 active:scale-95 transition">送出</button>${o.status!=='已完成發貨'?`<button data-rel="${o.docId}" class="px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs font-bold transition">放回</button>`:''}</div>
   </div></div></div>`}).join('')}</div>`:`<div class="text-center py-24"><div class="text-7xl mb-4 float">📦</div><div class="font-black text-xl text-slate-700">你還沒有接任何訂單</div><div class="text-sm text-slate-400 mt-1">到接單大廳挑一張吧</div></div>`;
}
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  try{
    if(d.claim){ // 交易保證同一張單只會被一個人接走
      b.closest('.tk')?.classList.add('fly');sfx('pop');
      await runTransaction(db,async tx=>{const r=doc(db,'orders',d.claim),s=await tx.get(r);
        if(!s.exists())throw new Error('訂單不存在');
        if(s.data().quoteState==='pending')throw new Error('這張單還在等老闆報價');
        if(s.data().assignee)throw new Error('這張單剛被別人接走了');
        tx.update(r,{assignee:me.id,assigneeName:me.name,claimedAt:new Date().toISOString()})});
      toast('✅ 接單成功！到「我的訂單」處理');party();sfx('fanfare');
    }
    if(d.rel&&confirm('確定放回接單大廳？')){await updateDoc(doc(db,'orders',d.rel),{assignee:null,assigneeName:null,claimedAt:null});sfx('whoosh');toast('已放回大廳')}
    if(d.note){const i=$('nt-'+d.note),t=i.value.trim();if(!t)return;await updateDoc(doc(db,'orders',d.note),{staffNotes:arrayUnion({by:me.name,text:t,at:now()})});sfx('pop');toast('備註已加入')}
  }catch(err){document.querySelectorAll('.tk.fly').forEach(x=>x.classList.remove('fly'));sfx('error');toast('⚠️ '+err.message)}
});
document.addEventListener('change',async e=>{
  const s=e.target.dataset.st;if(!s)return;
  try{await updateDoc(doc(db,'orders',s),{status:e.target.value,lastStaff:me.name});sfx(e.target.value==='已完成發貨'?'fanfare':'pop');toast('狀態已更新：'+e.target.value);if(e.target.value==='已完成發貨')party()}catch(err){toast('⚠️ '+err.message)}
});

// 自動恢復登入（仍驗證帳號是否存在且未停用）
try{const s=JSON.parse(sessionStorage.getItem('zahStaff')||'null');if(s){getDoc(doc(db,'staff',s.id)).then(x=>{if(x.exists()&&x.data().active!==false){me=s;enter()}})}}catch(e){}
</script>
</body>
</html>
